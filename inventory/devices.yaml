# R2lab extra devices: things that have an IP address on the testbed networks
# but are not nodes, i.e. that have no entry in boxes.yaml
#
# one entry per device; each one produces, in the generated files
#   * a line in the hosts file
#   * a dhcp-host line in dnsmasq, if there is a mac
#     (commented out if static is true, just to keep the mac around)
#
#   name:     the main hostname
#   ip:       its IP address
#   mac:      optional; without it there is nothing in dnsmasq
#   static:   optional, default false; true means the device is configured
#             statically, so it is not handed out by DHCP
#   aliases:  optional; other names in the hosts file
#   comment:  optional; shown above the generated lines
#   lab:      optional, prod (default), prep or both; where the device is
#             exposed, i.e. in the files for faraday and/or for the preplab

# the interfaces in the gateway on the various networks
- {name: rhubarbe-reboot,   ip: 192.168.1.100, aliases: [faraday1]}
- {name: rhubarbe-data,     ip: 192.168.2.100, aliases: [faraday2]}
- {name: rhubarbe-control,  ip: 192.168.3.100, aliases: [faraday3]}
- {name: rhubarbe-switches, ip: 192.168.4.100, aliases: [faraday4]}

# the network switches are configured statically
# for the record we keep their MAC addresses
- {name: switch-reboot,  ip: 192.168.4.101, mac: "f8:b1:56:42:52:a5", static: true, comment: "CONFIRMED reboot"}
- {name: switch-data,    ip: 192.168.4.102, mac: "f8:b1:56:33:50:ad", static: true, comment: "CONFIRMED to be the main data switch"}
- {name: switch-control, ip: 192.168.4.103, mac: "f8:b1:56:42:51:32", static: true, comment: "CONFIRMED control"}
- {name: switch-c007,    ip: 192.168.4.104, mac: "d0:67:e5:d6:ae:fe", static: true, comment: "switch in C007 type 5524"}
# switch radio (fs.com) in R2lab - uses DHCP for now
- {name: switch-radio,   ip: 192.168.4.105, mac: "64:9D:99:D0:57:52"}
- {name: wlab36,         ip: 192.168.4.36}

